# Overrides for a 4 GB staging-only host (OVH VPS-1: 2 vCore, 4 GB RAM). Merged over compose.yaml by
#   COMPOSE_FILE=compose.yaml:compose.small.yaml     (set in /srv/zandy/compose/.env by server-setup.sh)
# Start with:  docker compose --profile staging up -d   -> transactor, caddy, backend-staging, ssr-staging.
# Never use this file on a host that runs production.
#
# 4 GB plan (about 3.8 GB usable). Idle RSS measured on 25 Oct 2026 (JDK 25, 8 GB-layout heaps):
# transactor 632 MB (Xmx1024m), backend 475 MB (Xmx768m), ssr 317 MB (Xmx256m).
#   service          -Xmx    mem_limit   expected RSS (idle .. loaded)
#   transactor       512m    1152m       about 430 MB idle .. 1000 MB after a heavy write test (D3 says 1024m)
#   backend-staging  512m    900m        about 450 .. 750 MB   (D3 value)
#   ssr-staging      192m    512m        about 280 .. 380 MB   (D3 value)
#   caddy            -       192m        about 50 MB
#   sum of heaps 1216 MB; sum of limits 2756 MB; expected idle total about 1.3 GB, loaded about 2.1 GB;
#   OS and page cache about 0.5 GB, so about 1.2 GB stays free when loaded.
#   Transactor test (26 Oct 2026, real Datomic Pro 1.0.7745, JDK 25, memory-index 16m/128m, object cache 64m):
#   the real schema plus 144,000 entities (about 90 MB of data) in 120-transaction rounds ran without errors;
#   RSS 430 MB idle -> 864 MB -> 983 MB. With -Xmx640m the same first round gave 1015 MB. The part above the heap
#   is Datomic's off-heap and mapped storage files, hence a limit well above the heap. One-shot tasks (migrate, bootstrap-owner, seed) run with -Xmx256m or
#   384m (deploy.sh) so they fit beside the running set. A 2 GB swap file (server-setup.sh) is the last
#   safety net. The transactor heap is below D3 and must be measured on the real host: the test is in
#   RUNBOOK "What to measure on staging".
services:
  transactor:
    # -XX:ActiveProcessorCount=8: on a 2 vCore host Datomic 1.0.7745 sizes the health-endpoint Jetty pool from the CPU
    # count (pool max = CPUs + 1 is too small below 8 reported CPUs: 4 fails, 8 works) and dies at start ("Insufficient configured threads: required=3 < max=3", found on the OVH VPS-1, 26 Oct 2026).
    command: ["transactor", "-Xmx512m", "-Xms512m", "-XX:ActiveProcessorCount=8"]
    environment:
      DATOMIC_ALT_HOST: transactor
      DATOMIC_MEMORY_INDEX_THRESHOLD: 16m
      DATOMIC_MEMORY_INDEX_MAX: 128m
      DATOMIC_OBJECT_CACHE_MAX: 64m
    mem_limit: 1152m
    memswap_limit: 1152m

  backend-staging:
    mem_limit: 900m
    memswap_limit: 900m
    depends_on:
      mailsink:
        condition: service_started

  ssr-staging:
    mem_limit: 512m
    memswap_limit: 512m

  caddy:
    mem_limit: 192m
    memswap_limit: 192m

  # Staging mail sink (owner decision 26 Oct 2026, until the Gmail app password exists): accepts every
  # message from backend-staging on the private network, prints it decoded to its log, sends nothing.
  # Read it with /srv/zandy/bin/show-mail.sh. To use Gmail instead, see deploy/RUNBOOK.md "Switching
  # staging mail to Gmail"; this service can then be stopped. Not published on any port.
  mailsink:
    profiles: ["staging"]
    image: python:3.13-alpine
    init: true
    restart: unless-stopped
    command: ["python", "-u", "/app/sink.py"]
    environment:
      SINK_PORT: "2525"
    networks: [zandy]
    expose: ["2525"]
    volumes:
      - /srv/zandy/compose/mailsink/sink.py:/app/sink.py:ro
    read_only: true
    tmpfs:
      - /tmp:size=8m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    user: "10001:10001"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 64m
    memswap_limit: 64m
